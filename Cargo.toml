[package]
name = "blackmagic-camera-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Malachi Ayers"]
description = "Bridge BMPCC4K Bluetooth record signals to REAPER via OSC"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
async-trait = "0.1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
btleplug = "0.11"
rosc = "0.11"
futures = "0.3"

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
tempfile = "3"

[[bin]]
name = "camlink"
path = "src/main.rs"
