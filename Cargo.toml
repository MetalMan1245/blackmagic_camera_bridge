[package]
name = "blackmagic-camera-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Malachi Ayers"]
description = "Bridge BMPCC4K Bluetooth record signals to REAPER via OSC"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
async-trait = "0.1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
btleplug = "0.11"
uuid = { version = "1", features = ["v4"] }
rosc = "0.11"
futures = "0.3"
dirs = "5"  # For config path expansion
pyo3 = { version = "0.29", optional = true }

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
tempfile = "3"

[features]
default = []
# Python bindings for the PyQt6 front-end. `maturin develop` turns on
# `extension-module` automatically (declared in pyproject.toml), which is
# what stops the cdylib from linking libpython.
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[lib]
name = "blackmagic_camera_bridge"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "camlink"
path = "src/main.rs"
