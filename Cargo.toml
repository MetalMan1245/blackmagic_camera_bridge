[package]
name = "blackmagic-camera-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Malachi Ayers"]
description = "Bridge BMPCC4K Bluetooth record signals to REAPER via OSC"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
async-trait = "0.1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
btleplug = "0.11"
uuid = { version = "1", features = ["v4"] }
rosc = "0.11"
futures = "0.3"
dirs = "5"  # For config path expansion

[dev-dependencies]
mockall = "0.12"
tokio-test = "0.4"
tempfile = "3"


[features]
default = []
# Builds the Qt6 (cxx-qt) front-end `camlink-gui`. Requires Qt6 dev libraries
# and cmake on the system; the CLI (`camlink`) never needs them.
gui = ["dep:cxx-qt", "dep:cxx-qt-lib"]

[target.'cfg(feature = "gui")'.dependencies]
cxx-qt = { version = "0.8", optional = true }
cxx-qt-lib = { version = "0.8", optional = true }

[[bin]]
name = "camlink"
path = "src/main.rs"

[[bin]]
name = "camlink-gui"
path = "src/bin/camlink-gui.rs"
required-features = ["gui"]
